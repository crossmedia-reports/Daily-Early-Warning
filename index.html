<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Acces Securizat - Crossmedia</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #e6f0fa;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 90, 180, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .logo-box { margin-bottom: 25px; }
        .logo-box img { max-width: 220px; height: auto; }
        h1 { font-size: 1.4rem; color: #1e3a5f; margin: 0 0 10px 0; font-weight: 700; }
        p { color: #607d8b; font-size: 0.95rem; margin: 0 0 25px 0; }
        input[type="password"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 2px solid #cfd8dc;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus { border-color: #ff6d00; }
        button {
            background-color: #ff6d00;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover { background-color: #e65100; }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.7; cursor: wait; }
        .error { color: #d32f2f; margin-top: 15px; font-size: 0.9rem; font-weight: 500; display: none; }
        #protected-content { display: none; }
        .unlocked-body { display: block !important; background-color: transparent !important; padding: 0 !important; }
        .unlocked-container { max-width: 100% !important; box-shadow: none !important; padding: 0 !important; background: transparent !important; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <div id="login-zone">
        <div class="logo-box">
            <img src="sigla.png" alt="Crossmedia Logo">
        </div>
        <h1>Conținut Protejat</h1>
        <p>Introduceți parola pentru a decripta raportul.</p>
        <input type="password" id="password-input" placeholder="Parola..." onkeypress="handleKeyPress(event)">
        <button id="unlock-btn" onclick="unlockContent()">Accesează Datele</button>
        <div id="error-msg" class="error">Parolă incorectă! Încercați din nou.</div>
    </div>
    <div id="protected-content"></div>
</div>

    function dinB64(s) {
        const bin = atob(s);
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
    }

    function handleKeyPress(e) {
        if (e.keyCode === 13) unlockContent();
    }

    async function decripteaza(parola) {
        const enc = new TextEncoder();
        const sare = dinB64(PACHET.sare), iv = dinB64(PACHET.iv);
        const date = dinB64(PACHET.date), semnatura = dinB64(PACHET.semnatura);

        const baza = await crypto.subtle.importKey("raw", enc.encode(parola), "PBKDF2", false, ["deriveBits"]);
        const biti = new Uint8Array(await crypto.subtle.deriveBits(
            { name: "PBKDF2", hash: "SHA-256", salt: sare, iterations: PACHET.iteratii }, baza, 512));
        const hmacParam = { name: "HMAC", hash: "SHA-256" };
        const cheieCriptare = await crypto.subtle.importKey("raw", biti.slice(0, 32), hmacParam, false, ["sign"]);
        const cheieVerificare = await crypto.subtle.importKey("raw", biti.slice(32), hmacParam, false, ["verify"]);

        const mesaj = new Uint8Array(sare.length + iv.length + date.length);
        mesaj.set(sare, 0); mesaj.set(iv, sare.length); mesaj.set(date, sare.length + iv.length);
        const corect = await crypto.subtle.verify("HMAC", cheieVerificare, semnatura, mesaj);
        if (!corect) return null;

        const nrBlocuri = Math.ceil(date.length / 32);
        const rezultat = new Uint8Array(date.length);
        const LOT = 512;
        for (let start = 0; start < nrBlocuri; start += LOT) {
            const sarcini = [];
            for (let i = start; i < Math.min(start + LOT, nrBlocuri); i++) {
                const bloc = new Uint8Array(24);
                bloc.set(iv, 0);
                new DataView(bloc.buffer).setBigUint64(16, BigInt(i));
                sarcini.push(crypto.subtle.sign("HMAC", cheieCriptare, bloc));
            }
            const fluxuri = await Promise.all(sarcini);
            fluxuri.forEach((buf, k) => {
                const f = new Uint8Array(buf), poz = (start + k) * 32;
                for (let j = 0; j < 32 && poz + j < date.length; j++) rezultat[poz + j] = date[poz + j] ^ f[j];
            });
        }
        const flux = new Blob([rezultat]).stream().pipeThrough(new DecompressionStream("gzip"));
        return await new Response(flux).text();
    }

    async function unlockContent() {
        const password = document.getElementById('password-input').value;
        const errorMsg = document.getElementById('error-msg');
        const btn = document.getElementById('unlock-btn');
        errorMsg.style.display = 'none';
        btn.disabled = true;
        let decodedText = null;
        try {
            decodedText = await decripteaza(password);
        } catch (err) {
            decodedText = null;
        }
        btn.disabled = false;
        if (decodedText === null) {
            errorMsg.style.display = 'block';
            return;
        }

        document.getElementById('login-zone').remove();
        document.body.classList.add('unlocked-body');
        document.getElementById('main-container').classList.add('unlocked-container');

        const contentDiv = document.getElementById('protected-content');
        contentDiv.style.display = 'block';

        const iframe = document.createElement('iframe');
        iframe.style.width = '100%';
        iframe.style.height = '100vh';
        iframe.style.border = 'none';
        contentDiv.appendChild(iframe);

        const idoc = iframe.contentWindow.document;
        idoc.open();
        idoc.write(decodedText);
        idoc.close();
    }
